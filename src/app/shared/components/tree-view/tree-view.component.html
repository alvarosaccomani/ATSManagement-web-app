<nz-card [nzBordered]="false" [nzTitle]="title">

    @if(showSearch || showToolbar) {
        <!-- Barra de herramientas -->
        <div class="tree-toolbar">
            <div nz-row [nzGutter]="8" style="margin-bottom: 16px;">
                @if(showSearch) {
                    <!-- Búsqueda -->
                    <div nz-col [nzSpan]="8" *ngIf="searchable" style="min-width: 100%; margin: 0 0 10px 0;">
                        <nz-input-group nzPrefixIcon="search">
                        <input 
                            type="text" 
                            nz-input 
                            [(ngModel)]="searchText" 
                            (ngModelChange)="onSearchChange($event)"
                            placeholder="Buscar..."
                        />
                        </nz-input-group>
                    </div>
                }

                @if(showToolbar) {
                <!-- Botones de control -->
                <div nz-col [nzSpan]="searchable ? 16 : 24" style="display: flex; flex-direction: row; min-width: 100%;">
                    <button 
                        nz-button 
                        nzType="primary" 
                        (click)="expandAll()"
                        nz-tooltip="Expandir todos los nodos"
                        *ngIf="expandable"
                    >
                        <span nz-icon nzType="down-square"></span>
                        Expandir Todo
                    </button>
                    
                    <button 
                        nz-button 
                        nzType="default" 
                        (click)="collapseAll()"
                        nz-tooltip="Contraer todos los nodos"
                        *ngIf="expandable"
                        style="margin-left: 8px;"
                    >
                        <span nz-icon nzType="up-square"></span>
                        Contraer Todo
                    </button>
                    
                    <button 
                        nz-button 
                        nzType="default" 
                        (click)="checkAll()"
                        nz-tooltip="Marcar todos los nodos"
                        *ngIf="checkable"
                        style="margin-left: 8px;"
                    >
                        <span nz-icon nzType="check-square"></span>
                        Marcar Todo
                    </button>
                    
                    <button 
                        nz-button 
                        nzType="default" 
                        (click)="uncheckAll()"
                        nz-tooltip="Desmarcar todos los nodos"
                        *ngIf="checkable"
                        style="margin-left: 8px;"
                    >
                        <span nz-icon nzType="stop"></span>
                        Desmarcar Todo
                    </button>
                    
                    <button 
                        nz-button 
                        nzType="default" 
                        (click)="clearSelection()"
                        nz-tooltip="Limpiar selección"
                        style="margin-left: 8px;"
                    >
                        <span nz-icon nzType="close-circle"></span>
                        Limpiar
                    </button>

                </div>
                }
            </div>
        </div>
    }

    <!-- Tree principal -->
    <nz-tree
        [nzData]="filteredNodes"
        [nzBlockNode]="blockNode"
        [nzShowIcon]="showIcon"
        [nzCheckable]="checkable"
        [nzMultiple]="multiple"
        [nzDraggable]="draggable"
        [(nzExpandedKeys)]="expandedKeys"
        [(nzSelectedKeys)]="selectedKeys"
        [(nzCheckedKeys)]="checkedKeys"
        (nzClick)="onNodeClick($event)"
        (nzCheckBoxChange)="onNodeCheck($event)"
        (nzExpandedKeysChange)="onExpandChange($event)"
        >
    </nz-tree>

    <!-- Panel de información -->
    <nz-divider *ngIf="showInfoPanel"></nz-divider>

    <div *ngIf="showInfoPanel" nz-row [nzGutter]="16">
        <div nz-col [nzSpan]="12">
            <h4>Seleccionado:</h4>
            <nz-tag *ngIf="selectedNode" nzColor="blue">
                <span nz-icon [nzType]="selectedNode.icon || 'file'"></span>
                {{ selectedNode.title }}
            </nz-tag>
            <span *ngIf="!selectedNode" class="empty-text">Ninguno</span>
        </div>
        @if(checkable) {
            <div nz-col [nzSpan]="12">
                <h4>Checkeados ({{ checkedKeys.length }}):</h4>
                <div *ngIf="checkedKeys.length > 0">
                    <nz-tag 
                    *ngFor="let key of checkedKeys" 
                    nzColor="green"
                    style="margin-bottom: 4px; display: inline-block;"
                    >
                    {{ getNodeTitleByKey(key) }}
                    </nz-tag>
                </div>
                <span *ngIf="checkedKeys.length === 0" class="empty-text">Ninguno</span>
            </div>
        }
    </div>
</nz-card>
