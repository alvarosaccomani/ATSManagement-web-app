<div class="camera-container">
    <button class="btn-back" (click)="onClose.emit()">
        <span nz-icon nzType="arrow-left" nzTheme="outline"></span>
    </button>

    @if(isLoading) {
        <div class="loading-overlay">
            <nz-spin nzSimple nzSize="large"></nz-spin>
            <span>Iniciando cámara...</span>
        </div>
    }

    <video #video 
           autoplay 
           playsinline 
           [style.display]="isCameraActive && !isLoading ? 'block' : 'none'">
    </video>

    @if(isCameraActive && !isLoading) {
        <div class="capture-ui">
            <button class="shutter-button" (click)="capturePhoto()"></button>
            <p class="capture-hint">Encuadre el comprobante</p>
        </div>
    }

    <canvas #canvas style="display: none;"></canvas>

    @if(capturedImage && !isCameraActive) {
        <div class="preview-overlay">
            <img [src]="capturedImage" alt="Foto capturada">
            
            <div class="preview-toolbar">
                <button class="btn-action retake" (click)="retakePhoto()">
                    <span nz-icon nzType="reload" nzTheme="outline"></span> REINTENTAR
                </button>
                <button class="btn-action confirm" (click)="savePhoto()">
                    {{ existingImage ? 'CONTINUAR' : 'ACEPTAR' }} <span nz-icon nzType="check" nzTheme="outline"></span>
                </button>
            </div>
        </div>
    }
</div>
