<nz-spin [nzSpinning]="isLoading">
  <div style="max-width: 600px; margin: 0 auto;">
    <h2>{{ isEditing ? 'Editar Contacto' : 'Nuevo Contacto' }}</h2>

    <form nz-form [formGroup]="form" (ngSubmit)="onSubmit()" nzLayout="vertical">
      <nz-form-item *ngIf="isEditing">
        <nz-form-label>ID Contacto</nz-form-label>
        <nz-form-control>
          <input nz-input formControlName="prs_uuid" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzRequired>Ámbito Contexto</nz-form-label>
        <nz-form-control nzErrorTip="Por favor seleccione un ámbito">
          <nz-select formControlName="scp_uuid" nzPlaceholder="Seleccionar ámbito">
            <nz-option *ngFor="let s of scopes" [nzValue]="s.scp_uuid" [nzLabel]="s.scp_name"></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzRequired>Nombre / Razón Social</nz-form-label>
        <nz-form-control nzErrorTip="Por favor ingrese el nombre del contacto">
          <input nz-input formControlName="prs_name" placeholder="Ej: Juan Pérez, Empresa S.A." />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzRequired>Tipo de Contacto</nz-form-label>
        <nz-form-control nzErrorTip="Por favor seleccione el tipo">
          <nz-select formControlName="prs_type">
            <nz-option *ngFor="let t of personTypes" [nzValue]="t.value" [nzLabel]="t.label"></nz-option>
          </nz-select>
        </nz-form-control>
      </nz-form-item>

      <div style="display: flex; gap: 16px;">
        <nz-form-item style="flex: 1;">
          <nz-form-label>Teléfono</nz-form-label>
          <nz-form-control>
            <input nz-input formControlName="prs_phone" placeholder="Ej: +54 9 11 1234-5678" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item style="flex: 1;">
          <nz-form-label>Email</nz-form-label>
          <nz-form-control nzErrorTip="Por favor ingrese un email válido">
            <input nz-input formControlName="prs_email" placeholder="ejemplo@correo.com" />
          </nz-form-control>
        </nz-form-item>
      </div>

      <nz-form-item>
        <nz-form-label>CUIT / CUIL / DNI / Identificación Fiscal</nz-form-label>
        <nz-form-control>
          <input nz-input formControlName="prs_taxid" placeholder="Ej: 20-12345678-9" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label>Estado</nz-form-label>
        <nz-form-control>
          <nz-switch formControlName="prs_active"></nz-switch>
          <span style="margin-left: 8px;">{{ form.get('prs_active')?.value ? 'Activo' : 'Inactivo' }}</span>
        </nz-form-control>
      </nz-form-item>

      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px;">
        <button nz-button type="button" (click)="onCancel()">Cancelar</button>
        <button nz-button nzType="primary" type="submit" [nzLoading]="isLoading">
          {{ isEditing ? 'Guardar Cambios' : 'Crear Contacto' }}
        </button>
      </div>
    </form>
  </div>
</nz-spin>
